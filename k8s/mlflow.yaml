apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: mlops-u1
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-u1
  labels: {app: mlflow}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: mlflow-server:v3.15.2-pg      
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mlflow-db
          env:
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION   
              value: "false"
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=2
            - --backend-store-uri=postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - --artifacts-destination=/mlartifacts
            - --allowed-hosts=localhost:*,127.0.0.1:*,10.*,mlflow:*,mlflow.mlops-u1.svc:*,mlflow.mlops-u1.svc.cluster.local:*
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: artifacts
              mountPath: /mlartifacts
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-u1
spec:
  selector: {app: mlflow}
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500 
